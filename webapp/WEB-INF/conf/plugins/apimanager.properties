# {plugin.pluginName} properties file

#######################################################################################################
# Default Labels for XPage
apimanager.pageTitle=apimanager
apimanager.pagePathLabel=apimanager

apimanager.instance.environment.values=TEST,DEV,REC,PREPROD,PROD
apimanager.plan.loadbalancingstrategy.values=SEQUENCE,RANDOM,FAILOVER_SEQUENCE
apimanager.plan.headermatching.type.values=EXISTS,EQUALS,CONTAINS,STARTS_WITH,STARTS_WITH_IGNORE_CASE,GREATER_THAN,LESS_THAN,GREATER_THAN_OR_EQUALS,LESS_THAN_OR_EQUALS
apimanager.plan.ratelimiting.criteria.values=GLOBAL,USER,REMOTE_IP
apimanager.plan.ratelimiting.implementation.values=NONE,CONCURRENCY_ONLY,TOKEN_BUCKET,FIXED_WINDOW,SLIDING_WINDOW
apimanager.plan.ratelimiting.backend.values=MEMORY,JPA,REDIS

apimanager.plan.clienthttpconfig.connectionttl.default.value=-1
apimanager.plan.clienthttpconfig.connectiontimeout.default.value=0
apimanager.plan.clienthttpconfig.readtimeout.default.value=60000
apimanager.plan.clienthttpconfig.requesttimeout.default.value=60000
apimanager.plan.clienthttpconfig.codecmaxchunksize.default.value=8192
apimanager.plan.clienthttpconfig.codecmaxheadersize.default.value=8192
apimanager.plan.clienthttpconfig.codecinitialbuffersize.default.value=128
apimanager.plan.clienthttpconfig.codecmaxinitiallinelength.default.value=4096

apimanager.plan.ratelimiting.maxrequests.default.value=100
apimanager.plan.ratelimiting.timewindow.default.value=1000
apimanager.plan.ratelimiting.criteria.default.value=GLOBAL
apimanager.plan.ratelimiting.implementation.default.value=SLIDING_WINDOW
apimanager.plan.ratelimiting.backend.default.value=MEMORY